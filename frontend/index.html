<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRIX — Contextual Risk Intelligence</title>
    <meta name="description" content="CRIX correlates security signals into a contextual risk score and prioritizes what to fix first." />
    <meta name="theme-color" content="#060910" />
    <!--
      Serverless favicon: an inline SVG data-URI (gauge mark, accent cyan on the
      base-950 navy). No new asset file and no extra network request — this also
      removes the stray /favicon.ico 404 that showed up in the console.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23060910'/%3E%3Cpath d='M16 5.5a10.5 10.5 0 1 0 10.5 10.5' fill='none' stroke='%2322d3ee' stroke-width='3.2' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='2.8' fill='%2322d3ee'/%3E%3C/svg%3E"
    />
    <!--
      Fira Sans (UI) + Fira Code (numbers, IDs, hashes) — the pairing
      ui-ux-pro-max returns for a "dashboard, data, analytics, technical"
      product, and the two families named in tailwind.config.js.

      Self-hosted from src/assets/fonts (imported by main.tsx), NOT hotlinked
      from fonts.googleapis.com: a security tool should not leak a third-party
      request on every page load, and the app now renders with no outbound
      network access at all. No npm dependency is added — these are static
      woff2 files under the SIL Open Font License (see assets/fonts/OFL.txt).
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
