# Curated service catalog (~20 real services) for passkey/MFA/recovery readiness
# (§3.B, §8). Each row records provenance: a vendor documentation reference and
# a `last_verified` date. This is CURATED STATIC data, not auto-discovered.
#
# Fields:
#   service_name, supports_passkey, mfa_methods, recovery_methods,
#   sms_recovery_possible, notes, source, last_verified
#
# IMPORTANT: vendor MFA/recovery features change frequently. `notes` carries the
# honest caveat. If a value cannot be verified it should be omitted, not guessed.

services:
