    supports_passkey: true
    mfa_methods: [passkey, security_key, totp_app, device_prompt, sms]
    recovery_methods: [phone_sms, recovery_email, backup_codes]
    sms_recovery_possible: true
    notes: "Passkeys supported since 2023. SMS is still offered as 2SV/recovery."
    source: "Google Account Help — 2-Step Verification & passkeys"
    last_verified: "2026-10-08"

