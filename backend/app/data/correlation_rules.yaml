# Declarative correlation rules (§5, Phase 3).
#
# These are DATA, not code. The engine (app/engine/correlation.py) interprets
# them; no Python conditionals encode any specific correlation. Each rule has:
#   rule_id, version, title, scope, predicates, correlation_type, severity
#   logic, confidence aggregation, an optional observation window, and a
#   human-readable explanation template.
#
# Rule fields:
#   rule_id          stable identifier (never reused for a different claim)
#   version          bump when the rule's meaning or thresholds change; the
#                    correlation result records the version that produced it
#   scope            which findings may be combined:
#                      same_account   one account, one organization (default)
#                      same_asset     one COMPANY asset (asset_id must be known)
#                      linked_assets  two assets joined by an ADMIN_DECLARED
#                                     dependency edge — CRIX never invents edges
#   window_hours     optional: the matched findings' observation windows must
#                    fall within this span of each other. Used only where
#                    temporal proximity is the claim (a campaign), never as a
#                    decorative filter.
#
# Predicate fields: event_type, status (default FINDING), exposure_type (list =
# any-of), metadata (exact-match key/value), min_events (default 1).
#
# Severity logic (documented parameters):
#   base                - starting severity 0..1
#   per_event           - added per distinct contributing event, saturating
#   cap                 - maximum severity after additions
#   multiplier_rules    - contextual multipliers (fired when a predicate on
#                         metadata matches among the contributing events)
#
# Explanation templates may reference {asset_id}, {account_id}, {org_id},
# {finding_ids}, {first_seen}, {last_seen} and {window_hours}; the engine fills
# them from the matched findings, so an explanation cites the real evidence
# instead of a generic sentence. tests/test_correlation_org.py asserts that no
# template uses an unknown placeholder.

rules:
  - rule_id: credential_stuffing_risk
    version: "1.0.0"
    title: "Credential Stuffing Risk"
    correlation_type: CREDENTIAL_STUFFING
    scope: same_account
    match: all
    predicates:
      - event_type: BREACH_EXPOSURE
      - event_type: PASSWORD_REUSE
    severity:
      base: 0.55
      per_event: 0.05
      cap: 0.95
      multiplier_rules:
        - when: { exposure_type: [PASSWORD_AND_SESSION, SESSION_ONLY] }
          factor: 1.25
    confidence: min
    explanation: >-
      Reused credentials were observed together with a breach exposure. Attackers
      who obtain one leaked password routinely replay it against other services
      (credential stuffing), so the two findings compound rather than sitting
      independently.

  - rule_id: targeted_credential_theft
    version: "1.0.0"
    title: "Targeted Credential Theft"
    correlation_type: TARGETED_PHISHING
    scope: same_account
    match: all
    predicates:
      - event_type: PHISHING_MESSAGE_DETECTED
      - event_type: IDENTITY_EXPOSED
    severity:
      base: 0.5
      per_event: 0.05
      cap: 0.9
    confidence: min
    explanation: >-
      A likely phishing message was detected for an account whose identity
      (email/service) is already publicly exposed. Exposed identities give
      attackers the context to craft convincing, targeted lures.

  - rule_id: cascading_recovery_risk
    version: "1.0.0"
    title: "Cascading Recovery Risk"
    correlation_type: CASCADING_RECOVERY
    scope: same_account
    match: all
    predicates:
      - event_type: COMPROMISED_RECOVERY_ACCOUNT
      - event_type: ACCOUNT_DEPENDENCY
    severity:
      base: 0.6
      per_event: 0.05
      cap: 0.95
    confidence: min
    explanation: >-
      A high-centrality account used as a recovery route for others shows signs
      of compromise. Because other accounts trust it for recovery, this can
      cascade across the dependency graph.

  - rule_id: elevated_takeover_risk
    version: "1.0.0"
    title: "Elevated Takeover Risk"
    correlation_type: ELEVATED_TAKEOVER
    scope: same_account
    match: all
    predicates:
      - event_type: BREACH_EXPOSURE
      - event_type: MFA_MISSING
    severity:
      base: 0.5
      per_event: 0.05
      cap: 0.9
      multiplier_rules:
        - when: { exposure_type: [PASSWORD_AND_SESSION, SESSION_ONLY] }
          factor: 1.2
    confidence: min
    explanation: >-
      A breached account lacks a strong second factor. With no MFA, a leaked
      credential alone may be sufficient to reach the account, which raises
      severity above either finding alone.

  - rule_id: mfa_ineffective_session_exposure
    version: "1.0.0"
    title: "Critical: MFA Ineffective Due to Session Exposure"
    correlation_type: SESSION_HIJACK_EXPOSURE
    scope: same_account
    match: all
    predicates:
      - event_type: SESSION_EXPOSURE
        metadata: { mfa_bypass_capable: true }
    severity:
      base: 0.85
      per_event: 0.0
      cap: 1.0
    confidence: min
    explanation: >-
      A stolen session cookie that we assess as MFA bypass-capable means the
      attacker does not need to re-authenticate. MFA protects the login step,
      not an already-issued session, so the second factor is ineffective here.
      (This exposure scenario is SIMULATED — no real infostealer data is used.)

  - rule_id: identity_reuse_blend
    version: "1.0.0"
    title: "Reused Identity Across Breached and Safe Accounts"
    correlation_type: IDENTITY_REUSE_BLEND
    scope: same_account
    match: all
    predicates:
      - event_type: BREACH_EXPOSURE
      - event_type: PASSWORD_REUSE
      - event_type: MFA_MISSING
    severity:
      base: 0.6
      per_event: 0.03
      cap: 0.95
    confidence: min
    explanation: >-
      A breached account that also reuses passwords and lacks MFA combines the
      three factors most associated with account compromise into one path.

  - rule_id: sim_swap_recovery_exposure
    version: "1.0.0"
    title: "SIM-Swap Recovery Exposure"
    correlation_type: SIM_SWAP_EXPOSURE
    scope: same_account
    match: all
    predicates:
      - event_type: SIM_SWAP_VULNERABLE
      - event_type: MFA_MISSING
    severity:
      base: 0.5
      per_event: 0.05
      cap: 0.85
    confidence: min
    explanation: >-
      An account relies on SMS one-time codes for recovery while no stronger
      second factor is present. SMS is vulnerable to SIM-swap, so recovery can
      be subverted by porting the phone number.

  - rule_id: oversharing_and_phishing
    version: "1.0.0"
    title: "Over-Permissioned Access Plus Active Phishing"
    correlation_type: PERMISSION_PHISHING
    scope: same_account
    match: all
    predicates:
      - event_type: RISKY_PERMISSION_GRANTED
      - event_type: PHISHING_MESSAGE_DETECTED
    severity:
      base: 0.45
      per_event: 0.05
      cap: 0.85
    confidence: min
    explanation: >-
      A third-party app holds high-sensitivity permissions while phishing
      targeting the user is also detected. If the app or user is lured, the
      granted permissions widen what is exposed.

  # ------------------------------------------------------------------------ #
  # Phase 3 rules (organization/asset-aware). Three only, each exercising one
  # capability the organization-first model makes possible: company-asset
  # identity, admin-declared dependency edges, and the observation window.
  # ------------------------------------------------------------------------ #
  - rule_id: company_asset_compound_exposure
    version: "1.0.0"
    title: "One Company Asset, Several Findings"
    correlation_type: SAME_ASSET_COMPOUND
    scope: same_asset
    match: all
    predicates:
      - event_type: BREACH_EXPOSURE
      - event_type: MFA_MISSING
    severity:
      base: 0.55
      per_event: 0.05
      cap: 0.9
    confidence: min
    explanation: >-
      Two independent findings are attached to the same company asset
      ({asset_id}): a breach exposure for its address and a missing second
      factor. Because both describe one asset the business depends on, they
      compound into a single asset-level exposure rather than two unrelated
      account notes.

  - rule_id: declared_dependency_exposure
    version: "1.0.0"
    title: "Exposure Crossing a Declared Dependency"
    correlation_type: DECLARED_DEPENDENCY_CHAIN
    scope: linked_assets
    match: all
    predicates:
      - event_type: BREACH_EXPOSURE
      - event_type: MFA_MISSING
    severity:
      base: 0.55
      per_event: 0.05
      cap: 0.9
    confidence: min
    explanation: >-
      An admin declared that these two company assets depend on each other, and
      now one of them ({asset_ids}) carries a breach exposure while the other
      lacks a second factor. Because the relationship was declared by the
      company rather than inferred from names, the exposure can travel along a
      real integration path.

  - rule_id: phishing_campaign_window
    version: "1.0.0"
    title: "Repeated Phishing Within 30 Days"
    correlation_type: PHISHING_CAMPAIGN
    scope: same_account
    match: all
    window_hours: 720
    predicates:
      - event_type: PHISHING_MESSAGE_DETECTED
        min_events: 2
    severity:
      base: 0.5
      per_event: 0.1
      cap: 0.8
    confidence: min
    explanation: >-
      Two or more likely-phishing messages reached the same account within a
      30-day window ({first_seen} to {last_seen}). Repeated lures in a short
      period look like a campaign against this account rather than isolated
      noise, which is why the timing is part of the claim.
