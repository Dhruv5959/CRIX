# Curated account dependency edges (§8). STATIC / hand-verified — NOT
# auto-discovered. Each edge records a source reference and last_verified date.
#
# Meaning of an edge A -> B ("A is a recovery/OAuth route to B"): if A is
# compromised, it can plausibly be used to reach or recover B. Weight reflects
# how direct/strong that route is (1.0 = direct recovery/OAuth, lower = partial).
#
# relationship_type: recovery_email | recovery_phone | oauth_dependency |
#                    sso_dependency | shared_recovery

